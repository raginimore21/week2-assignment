
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | SecureAuth</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="auth-card dashboard-card">
    <div class="brand">SecureAuth</div>
    <h1>Dashboard</h1>
    <p class="subtitle">You are successfully logged in.</p>

    <div class="success-panel">
      <h2 id="welcomeMessage">Loading your profile...</h2>
      <p id="dashboardMessage" role="status">
        Checking authentication...
      </p>
    </div>

    <button type="button" id="logoutButton" class="logout-button">
      Log Out
    </button>
  </main>
</body>
</html>
